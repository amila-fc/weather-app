<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <!-- Pre-paint: pick the stored theme (or the OS preference) before the bundle runs, so the
         first paint already uses the right tokens and there is no flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('weather-app:theme:v1');
          var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              typeof window.matchMedia === 'function' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
