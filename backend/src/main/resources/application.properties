logging.level.root=INFO
logging.level.com.sample:DEBUG
nws.baseUrl=https://api.weather.gov
nws.userAgent=WeatherService/1.0 (weather-app)

# Weather cache. TTL accepts java.time.Duration syntax (5m, PT5M, 300s); entries stop being served
# after that much time has passed since they were written. Defaults: 5m and 1000 entries.
weather.cache.ttl=5m
weather.cache.max-size=1000

# Message bundle that holds the frost advisories (frost.advisory.*). UTF-8 keeps non-ASCII characters intact.
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# OpenAPI 3 contract of the REST layer (see config/OpenApiConfig plus the springdoc annotations on
# WeatherController). The document is generated from the code and served read-only at /v3/api-docs, with the
# interactive UI at /swagger-ui.html.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# Every JSON endpoint produces application/json; without this the contract would advertise */*.
springdoc.default-produces-media-type=application/json

# Multi-provider integration: NWS is primary, Open-Meteo is the fallback/averaging partner.
# Timeouts are per provider and also bound the HTTP client. Defaults: 2s for both.
weather.secondary.base-url=https://api.open-meteo.com/v1/forecast
weather.secondary.user-agent=WeatherService/1.0 (weather-app)
weather.primary.timeout=2s
weather.secondary.timeout=2s
# true (default): average the numeric fields when both providers answer; false: always prefer NWS.
weather.averaging.enabled=true

# Weather history: in-memory H2, the schema is throwaway and recreated on every start.
spring.datasource.url=jdbc:h2:mem:weatherdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# GET /api/weather/history defaults: 7 days, at most 30, trend threshold in °F per day.
weather.history.default-days=7
weather.history.max-days=30
weather.history.trend-threshold=0.5

# GET /api/weather/trends: hours window (1..max-hours, default-hours when omitted) and the synthetic-data
# switch. While weather.trends.mock=true the hourly series is generated deterministically and the response
# carries "mock": true; nothing is written to weather_history.
weather.trends.default-hours=24
weather.trends.max-hours=48
weather.trends.mock=true