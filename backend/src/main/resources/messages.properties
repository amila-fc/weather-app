frost.advisory.none=No frost expected. Temperatures stay at or above freezing.
frost.advisory.light=Frost possible overnight. Cover sensitive plants and bring pets indoors.
frost.advisory.moderate=Hard frost likely. Drain outdoor hoses, insulate exposed pipes, and protect young plants.
frost.advisory.severe=Severe frost. Keep livestock sheltered, let taps drip to protect pipes, and avoid unnecessary travel on icy surfaces.
